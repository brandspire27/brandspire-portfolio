<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ======================================================
         PRIMARY SEO
    ======================================================= -->

    <title>BrandSpire | Web, App & Software Development Solutions</title>

    <meta
      name="description"
      content="BrandSpire builds modern websites, mobile apps, custom software, SaaS products, CRM, POS and business automation solutions."
    />

    <meta name="author" content="BrandSpire" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <link
      rel="canonical"
      href="https://brandspire.tech/"
    />

    <!-- ======================================================
         THEME
    ======================================================= -->

    <meta
      name="theme-color"
      content="#070b18"
    />

    <!-- ======================================================
         FAVICON
    ======================================================= -->

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- ======================================================
         OPEN GRAPH
         WhatsApp / LinkedIn / Facebook / Discord
    ======================================================= -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="BrandSpire"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      property="og:title"
      content="BrandSpire | Web, App & Software Development Solutions"
    />

    <meta
      property="og:description"
      content="Modern websites, mobile apps, custom software, SaaS, CRM, POS and automation solutions for businesses."
    />

    <meta
      property="og:url"
      content="https://brandspire.tech/"
    />

    <meta
      property="og:image"
      content="https://brandspire.tech/og-image.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="BrandSpire - Web, App and Software Development Solutions"
    />

    <!-- ======================================================
         X / TWITTER CARD
    ======================================================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="BrandSpire | Web, App & Software Development Solutions"
    />

    <meta
      name="twitter:description"
      content="Modern websites, mobile apps, custom software, SaaS, CRM, POS and automation solutions."
    />

    <meta
      name="twitter:image"
      content="https://brandspire.tech/og-image.png"
    />

    <meta
      name="twitter:image:alt"
      content="BrandSpire - Web, App and Software Development Solutions"
    />

    <!-- ======================================================
         STRUCTURED DATA / SCHEMA
    ======================================================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://brandspire.tech/#organization",
            "name": "BrandSpire",
            "url": "https://brandspire.tech/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://brandspire.tech/logo.png"
            },
            "description": "BrandSpire provides web development, mobile application development, custom software, SaaS, CRM, POS and business automation solutions.",
            "email": "contact@brandspire.tech",
            "areaServed": "Worldwide",
            "contactPoint": {
              "@type": "ContactPoint",
              "email": "contact@brandspire.tech",
              "contactType": "customer support"
            },
            "knowsAbout": [
              "Web Development",
              "Mobile App Development",
              "Custom Software Development",
              "SaaS Development",
              "CRM Development",
              "POS and Billing Systems",
              "Business Automation",
              "Digital Technology Solutions"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://brandspire.tech/#website",
            "url": "https://brandspire.tech/",
            "name": "BrandSpire",
            "publisher": {
              "@id": "https://brandspire.tech/#organization"
            },
            "inLanguage": "en"
          }
        ]
      }
    </script>

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
